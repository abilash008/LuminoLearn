<!-- Save this as "lumino_favicon.svg" (or adapt to .ico/.png as needed) -->
<svg version="1.1"
    width="64"
    height="64"
    viewBox="0 0 64 64"
    xmlns="http://www.w3.org/2000/svg">

<!-- Background (optional if you want transparency) -->
<rect width="64" height="64" fill="white" />

<!-- First "L" shape (Black) -->
<g fill="#000000">
    <!-- Vertical bar -->
    <rect x="10" y="10" width="10" height="40" />
    <!-- Horizontal bar -->
    <rect x="10" y="40" width="30" height="10" />
</g>

<!-- Second "L" shape (Cyan), slightly offset to intersect -->
<g fill="#00ffff">
    <!-- Vertical bar -->
    <rect x="28" y="14" width="10" height="40" />
    <!-- Horizontal bar -->
    <rect x="28" y="44" width="30" height="10" />
</g>
</svg>
