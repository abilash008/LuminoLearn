{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="cyber-container">
    <h1 class="neon-heading cyber-glitch">CONFIGURE_CODE_PROTOCOL</h1>
    
    <form class="cyber-form" method="post">
        {% csrf_token %}
        
        <div class="cyber-card">
            <div class="node-header neon-cyan">
                <h3>> ACTIVE_QUERY</h3>
            </div>
            <div class="node-body">
                <p class="neon-pink code-font">{{ question.question_text|upper }}</p>
            </div>
        </div>

        <div class="cyber-grid">
            <div class="cyber-card">
                <div class="node-header neon-cyan">
                    <h3>> TEST_CASES</h3>
                </div>
                <div class="node-body">
                    <textarea class="cyber-textarea code-font"
                            name="test_cases" 
                            rows="5"
                            placeholder="INPUT_1\nINPUT_2\nINPUT_N"
                            data-cyber-required>{% if code_question %}{{ code_question.test_cases }}{% endif %}</textarea>
                </div>
            </div>

            <div class="cyber-card">
                <div class="node-header neon-cyan">
                    <h3>> EXPECTED_OUTPUT</h3>
                </div>
                <div class="node-body">
                    <textarea class="cyber-textarea code-font"
                            name="expected_output" 
                            rows="5"
                            placeholder="OUTPUT_1\nOUTPUT_2\nOUTPUT_N"
                            data-cyber-required>{% if code_question %}{{ code_question.expected_output }}{% endif %}</textarea>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="cyber-button cyan pulse">
                <i class="fas fa-save"></i> ENCRYPT_CONFIG
            </button>
            <a href="{% url 'add_questions' question.assignment.id %}" class="cyber-button pink">
                <i class="fas fa-arrow-left"></i> RETURN_TO_QUESTIONS
            </a>
        </div>
    </form>
</div>

<style>
.cyber-container {
    max-width: 1200px;
    margin: 2rem auto;
    padding: 2rem;
}

.cyber-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    margin: 2rem 0;
}

.cyber-card {
    background: #0a0a0f;
    border: 2px solid #00ffb3;
    border-radius: 5px;
}

.node-header {
    padding: 1.5rem;
    background: #001a14;
    border-bottom: 2px solid #00ffb3;
}

.node-body {
    padding: 2rem;
}

.code-font {
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    color: #00ffb3;
}

.cyber-textarea {
    min-height: 200px;
    resize: vertical;
    white-space: pre;
}

@media (max-width: 768px) {
    .cyber-grid {
        grid-template-columns: 1fr;
    }
    
    .cyber-container {
        padding: 1rem;
    }
    
    .node-body {
        padding: 1rem;
    }
}
</style>

<script>
document.querySelectorAll('[data-cyber-required]').forEach(element => {
    element.addEventListener('input', function() {
        const hasContent = this.value.trim().length > 0;
        this.style.borderColor = hasContent ? '#00ffb3' : '#ff0066';
        this.style.boxShadow = hasContent 
            ? '0 0 15px rgba(0, 255, 179, 0.3)' 
            : '0 0 15px rgba(255, 0, 102, 0.3)';
    });
    
    // Trigger initial validation
    element.dispatchEvent(new Event('input'));
});
</script>
{% endblock %}
