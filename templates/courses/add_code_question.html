{% extends 'base.html' %}
{% load static %}

{% block content %}

    <h1 class="neon-heading">Configure Code Question</h1>
    
    <form class="cyber-form" method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="neon-label">Question:</label>
            <p class="cyber-text">{{ question.question_text }}</p>
        </div>

        <div class="form-group">
            <label class="neon-label">Test Cases (one per line)</label>
            <textarea class="cyber-textarea" 
                    name="test_cases" 
                    rows="3"
                    placeholder="Input 1&#10;Input 2">{% if code_question %}{{ code_question.test_cases }}{% endif %}</textarea>
        </div>

        <div class="form-group">
            <label class="neon-label">Expected Output (one per line)</label>
            <textarea class="cyber-textarea" 
                    name="expected_output" 
                    rows="3"
                    placeholder="Output 1&#10;Output 2">{% if code_question %}{{ code_question.expected_output }}{% endif %}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="gradient-btn-cyan">
                <i class="fas fa-save"></i> Save Configuration
            </button>
            <a href="{% url 'add_questions' question.assignment.id %}" class="gradient-btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Questions
            </a>
        </div>
    </form>

{% endblock %}
