{% extends 'base.html' %}
{% load static %}

{% block title %}INJECT_TOPIC: {{ course.title|upper }}{% endblock %}

{% block content %}
<div class="cyber-container">
    <h1 class="neon-heading cyber-glitch">INJECT_TOPIC: <span class="neon-pink">{{ course.title|upper }}</span></h1>
    
    <form class="cyber-form" method="POST" enctype="multipart/form-data" action="{% url 'add_topic' course.id %}">
        {% csrf_token %}
        
        <div class="cyber-card">
            <div class="node-header neon-cyan">
                <h3>> TOPIC_CREATION_PROTOCOL</h3>
            </div>
            <div class="node-body">
                <div class="form-group">
                    <label class="neon-label">TOPIC_IDENTIFIER</label>
                    <input type="text" 
                           class="cyber-input" 
                           id="topic_name" 
                           name="topic_name" 
                           required
                           placeholder="ENTER_TOPIC_NAME..."
                           data-cyber-required>
                </div>

                <div class="form-group">
                    <label class="neon-label">CONTENT_MATRIX</label>
                    <textarea class="cyber-textarea code-font" 
                              id="topic_content" 
                              name="topic_content" 
                              rows="8"
                              required
                              placeholder="INITIATE_CONTENT_INPUT..."
                              data-cyber-required></textarea>
                </div>

                <div class="form-group">
                    <label class="neon-label">DIAGRAM_UPLOAD_SEQUENCE</label>
                    <div class="file-upload-wrapper">
                        <input type="file" 
                               class="cyber-file-input" 
                               id="topic_diagrams" 
                               name="topic_diagrams" 
                               accept="image/*" 
                               multiple
                               required>
                        <label for="topic_diagrams" class="cyber-file-label pulse">
                            <i class="fas fa-cloud-upload-alt neon-cyan"></i> 
                            <span>SELECT_DIAGRAM_FILES</span>
                        </label>
                        <span class="cyber-file-name" id="diagram-file-name">NO_FILES_SELECTED</span>
                    </div>
                    <div class="cyber-preview-grid" id="thumbnail-preview"></div>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="cyber-button cyan pulse">
                <i class="fas fa-rocket"></i> LAUNCH_TOPIC
            </button>
            <a href="{% url 'manage_courses' %}" class="cyber-button pink">
                <i class="fas fa-power-off"></i> ABORT_MISSION
            </a>
        </div>
    </form>
</div>

<style>
.cyber-container {
    max-width: 800px;
    margin: 2rem auto;
    padding: 2rem;
}

.cyber-card {
    background: #0a0a0f;
    border: 2px solid #00ffb3;
    border-radius: 5px;
    margin: 2rem 0;
}

.node-header {
    padding: 1.5rem;
    background: #001a14;
    border-bottom: 2px solid #00ffb3;
}

.node-body {
    padding: 2rem;
}

.code-font {
    font-family: 'Courier New', monospace;
    font-size: 0.95rem;
}

.cyber-preview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 1rem;
    margin-top: 1rem;
}

.cyber-preview-grid img {
    border: 2px solid #ff00ff;
    border-radius: 3px;
    padding: 3px;
    background: #001a14;
    transition: all 0.3s ease;
}

.cyber-preview-grid img:hover {
    transform: scale(1.1);
    box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
}

@keyframes pulse-upload {
    0% { box-shadow: 0 0 10px rgba(0, 255, 179, 0.3); }
    50% { box-shadow: 0 0 20px rgba(0, 255, 179, 0.6); }
    100% { box-shadow: 0 0 10px rgba(0, 255, 179, 0.3); }
}

.pulse {
    animation: pulse-upload 1.5s infinite;
}

@media (max-width: 768px) {
    .cyber-container {
        padding: 1rem;
    }
    
    .cyber-preview-grid {
        grid-template-columns: repeat(2, 1fr);
    }
    
    .node-body {
        padding: 1rem;
    }
}
</style>

<script>
document.getElementById('topic_diagrams').addEventListener('change', function(e) {
    const files = e.target.files;
    const preview = document.getElementById('thumbnail-preview');
    const fileName = document.getElementById('diagram-file-name');
    
    fileName.textContent = files.length > 0 
        ? `FILES_ACQUIRED: ${files.length}` 
        : 'NO_FILES_SELECTED';

    preview.innerHTML = '';
    
    Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.createElement('img');
            img.src = e.target.result;
            img.style.width = '100%';
            img.style.height = '100px';
            img.style.objectFit = 'cover';
            preview.appendChild(img);
        }
        reader.readAsDataURL(file);
    });
});

document.querySelectorAll('[data-cyber-required]').forEach(input => {
    input.addEventListener('input', function() {
        if(this.value) {
            this.style.borderColor = '#00ffb3';
            this.style.boxShadow = '0 0 15px rgba(0, 255, 179, 0.3)';
        } else {
            this.style.borderColor = '#ff0066';
            this.style.boxShadow = '0 0 15px rgba(255, 0, 102, 0.3)';
        }
    });
});
</script>
{% endblock %}
