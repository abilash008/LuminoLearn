{% extends 'base.html' %}
{% load static %}

{% block content %}
<main class="cyber-container">
    <h1 class="neon-heading-danger">Delete Assignment</h1>
    
    <div class="cyber-alert">
        <div class="alert-content">
            <i class="fas fa-exclamation-triangle fa-2x"></i>
            <h3>Confirm Deletion</h3>
            <p>You're about to permanently delete:<br>
            <span class="glowing-text">{{ assignment.title }}</span></p>
            
            <form method="post" class="confirmation-form">
                {% csrf_token %}
                <div class="confirmation-actions">
                    <button type="submit" class="classgradient-btn-red">
                        <i class="fas fa-skull-crossbones"></i> Confirm Delete
                    </button>
                    <a href="{% url 'educator_assignments' %}" class="gradient-btn-secondary">
                        <i class="fas fa-arrow-left"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
