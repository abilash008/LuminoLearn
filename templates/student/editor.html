{% extends 'base.html' %}
{% load static %}

{% block content %}
{% csrf_token %}

<div class="ide-container">
    <!-- Header Controls -->
    <div class="ide-header">
        <div class="header-left">
            <select id="language-select" class="cyber-select">
                {% for lang in languages %}
                <option value="{{ lang.value }}">{{ lang.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="header-right">
            <button id="run-code" class="cyber-button">
                <span class="button-content">
                    <i class="fas fa-play"></i>
                    <span class="button-text">Run (Ctrl+Enter)</span>
                    <div class="button-loader"></div>
                </span>
            </button>
        </div>
    </div>

    <!-- Main Editor Area -->
    <div class="editor-wrapper">
        <div id="editor-container" class="monaco-editor"></div>
        
        <!-- IO Panels -->
        <div class="io-panels">
            <div class="io-panel input-panel">
                <div class="panel-header">
                    <i class="fas fa-terminal"></i>
                    <span>Input</span>
                </div>
                <textarea id="user-input" class="cyber-input" placeholder="Enter all program inputs here, each on a new line..."></textarea>
            </div>
            <div class="io-panel output-panel">
                <div class="panel-header">
                    <i class="fas fa-code"></i>
                    <span>Output</span>
                </div>
                <pre id="output" class="cyber-output"></pre>
            </div>
        </div>
    </div>
</div>

<a href="{% url 'student_dashboard' %}" class="back-button"> 
    <i class="fas fa-arrow-left"></i> Back to Dashboard
</a>

<!-- Monaco Editor Setup -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
<script>
    const csrfToken = "{{ csrf_token }}";
    let isRunning = false;

    // Initialize after DOM loads
    document.addEventListener('DOMContentLoaded', function() {
        const languageMap = {
            'python3': 'python',
            'nodejs': 'javascript',
            'java': 'java',
            'cpp': 'cpp'
        };
    
        // Initialize Editor
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            window.editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: "print('Welcome to LuminoLearn!')\n# Start coding here...",
                language: languageMap['python3'],
                theme: 'vs-dark',
                automaticLayout: true,
                minimap: { enabled: true },
                fontSize: 14,
                scrollBeyondLastLine: false,
                roundedSelection: false,
                padding: { top: 10 },
            });
        });

        // Language Switch
        document.getElementById('language-select').addEventListener('change', function() {
            const model = window.editor.getModel();
            const selectedLang = this.value;
            const monacoLang = languageMap[selectedLang];
            monaco.editor.setModelLanguage(model, monacoLang);
        });

        // Code Execution
        document.getElementById('run-code').addEventListener('click', executeCode);
        
        // Ctrl+Enter shortcut
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                executeCode();
            }
        });
    });

    async function executeCode() {
        if (isRunning) return;
        
        const code = window.editor.getValue();
        const language = document.getElementById('language-select').value;
        const inputElement = document.getElementById('user-input');
        const userInput = inputElement.value.trim();
        const runButton = document.getElementById('run-code');
        const outputElement = document.getElementById('output');
        
        try {
            isRunning = true;
            runButton.classList.add('running');
            outputElement.innerHTML = '';

            // Send code and input to backend
            const response = await fetch("{% url 'execute_code' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ 
                    code, 
                    language,
                    input: userInput 
                })
            });
            const result = await response.json();

            if (result.error) {
                outputElement.classList.add('error');
                outputElement.textContent = result.error;
            } else {
                // Filter output to separate prompts from actual output
                const outputLines = result.output.split('\n');
                let prompts = [];
                let finalOutput = [];
                
                // For Python, extract prompts from input() calls in the code
                if (language === 'python3') {
                    const codeLines = code.split('\n');
                    codeLines.forEach(line => {
                        const match = line.match(/input\s*\(['"](.*?)['"]\)/);
                        if (match) prompts.push(match[1]);
                    });
                }
                // For other languages, assume prompts are explicitly printed (simplified)
                // This could be enhanced with language-specific parsing if needed

                // Filter output: exclude lines matching prompts
                outputLines.forEach(line => {
                    if (prompts.includes(line.trim())) {
                        // Prompt line, skip it in output
                    } else {
                        finalOutput.push(line);
                    }
                });

                // Display prompts in input field if user hasn't provided input yet
                if (!userInput && prompts.length > 0) {
                    inputElement.value = prompts.join('\n');
                    outputElement.textContent = 'Please enter the required inputs above and run again.';
                } else {
                    outputElement.textContent = finalOutput.join('\n').trim();
                }
            }

        } catch (error) {
            outputElement.classList.add('error');
            outputElement.textContent = `Execution error: ${error.message}`;
        } finally {
            isRunning = false;
            runButton.classList.remove('running');
        }
    }
</script>

<style>
    /* Existing styles remain unchanged, removing only unnecessary parts */
    :root {
        --neon-cyan: #00ffff;
        --neon-purple: #bc13fe;
        --dark-bg: #0a0a0f;
        --panel-bg: #151520;
        --text-primary: #e0e0ff;
    }

    .ide-container {
        background: var(--dark-bg);
        border: 1px solid rgba(0, 255, 255, 0.1);
        border-radius: 8px;
        margin: 20px;
        height: calc(100vh - 150px);
        display: flex;
        flex-direction: column;
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
        text-align: left;
    }

    .ide-header {
        display: flex;
        justify-content: space-between;
        padding: 15px;
        background: var(--panel-bg);
        border-bottom: 1px solid rgba(0, 255, 255, 0.1);
    }

    .editor-wrapper {
        display: grid;
        grid-template-columns: 3fr 2fr;
        gap: 20px;
        flex: 1;
        padding: 20px;
        overflow: hidden;
    }

    .monaco-editor {
        height: 100%;
        border: 1px solid rgba(0, 255, 255, 0.2);
        border-radius: 6px;
        overflow: hidden;
    }

    .io-panels {
        display: flex;
        flex-direction: column;
        gap: 20px;
        height: 100%;
    }

    .io-panel {
        background: var(--panel-bg);
        border: 1px solid rgba(0, 255, 255, 0.1);
        border-radius: 6px;
        height: 50%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .panel-header {
        padding: 12px;
        background: rgba(0, 0, 0, 0.3);
        border-bottom: 1px solid rgba(0, 255, 255, 0.1);
        color: var(--neon-cyan);
        font-family: 'Courier New', monospace;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .cyber-input, .cyber-output {
        flex: 1;
        background: transparent;
        border: none;
        padding: 15px;
        color: var(--text-primary);
        font-family: 'Courier New', monospace;
        font-size: 14px;
        resize: none;
        outline: none;
    }

    .cyber-output {
        white-space: pre-wrap;
        overflow-y: auto;
    }

    .cyber-output.error {
        color: #ff5555;
    }

    .cyber-button {
        background: linear-gradient(145deg, #0066cc, #0044aa);
        border: 1px solid var(--neon-cyan);
        border-radius: 4px;
        padding: 10px 20px;
        color: white;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: all 0.3s;
    }

    .cyber-button:hover {
        background: linear-gradient(145deg, #0077dd, #0055bb);
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
    }

    .button-loader {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 20px;
        height: 20px;
        border: 3px solid #fff;
        border-radius: 50%;
        border-top-color: transparent;
        animation: spin 1s linear infinite;
    }

    .cyber-button.running .button-text {
        visibility: hidden;
    }

    .cyber-button.running .button-loader {
        display: block;
    }

    @keyframes spin {
        to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .back-button {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: var(--panel-bg);
        padding: 10px 20px;
        border-radius: 4px;
        color: var(--neon-cyan);
        text-decoration: none;
        border: 1px solid rgba(0, 255, 255, 0.2);
    }
</style>
{% endblock %}
