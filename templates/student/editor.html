{% extends 'base.html' %}
{% load static %}

{% block content %}
{% csrf_token %}

<div class="cyber-container">
    <!-- Cyberpunk Header -->
    <div class="cyber-header neon-glow">
        <div class="header-left">
            <select id="language-select" class="cyber-select">
                {% for lang in languages %}
                <option value="{{ lang.value }}">{{ lang.name|upper }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="header-right">
            <button id="run-code" class="cyber-button cyan pulse">
                <span class="button-content">
                    <i class="fas fa-terminal"></i>
                    <span class="button-text">EXECUTE (CTRL+ENTER)</span>
                    <div class="button-loader"></div>
                </span>
            </button>
        </div>
    </div>

    <!-- Main Cyber Editor -->
    <div class="cyber-editor-grid">
        <div id="editor-container" class="cyber-editor"></div>
        
        <!-- Cyber IO Panels -->
        <div class="cyber-io-panels">
            <div class="cyber-panel input-panel">
                <div class="panel-header neon-cyan">
                    <i class="fas fa-terminal"></i>
                    <span>INPUT STREAM</span>
                </div>
                <textarea id="user-input" class="cyber-console" 
                    placeholder=">> ENTER INPUT PROTOCOLS HERE <<"></textarea>
            </div>
            <div class="cyber-panel output-panel">
                <div class="panel-header neon-cyan">
                    <i class="fas fa-code"></i>
                    <span>OUTPUT FEED</span>
                </div>
                <pre id="output" class="cyber-output"></pre>
            </div>
        </div>
    </div>
</div>

<a href="{% url 'student_dashboard' %}" class="cyber-button back-btn">
    <i class="fas fa-arrow-left"></i> [ RETURN TO MAINFRAME ]
</a>

<!-- Monaco Editor Setup -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
<script>
    const csrfToken = "{{ csrf_token }}";
    let isRunning = false;

    document.addEventListener('DOMContentLoaded', function() {
        const languageMap = {
            'python3': 'python',
            'nodejs': 'javascript',
            'java': 'java',
            'cpp': 'cpp'
        };

        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            monaco.editor.defineTheme('cyberpunk', {
                base: 'vs-dark',
                inherit: true,
                rules: [
                    { token: '', foreground: '00ffb3', background: '0a0a0f' },
                    { token: 'keyword', foreground: 'ff006e' },
                    { token: 'number', foreground: '00f7ff' }
                ],
                colors: {
                    'editor.background': '#0a0a0f',
                    'editor.lineHighlightBackground': '#00000040',
                }
            });

            window.editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: "print('INITIALIZING CYBER SYSTEM...')\n# BEGIN CODING SEQUENCE",
                language: languageMap['python3'],
                theme: 'cyberpunk',
                automaticLayout: true,
                minimap: { enabled: true },
                fontSize: 14,
                scrollBeyondLastLine: false,
                roundedSelection: false,
                padding: { top: 10 },
            });
        });

        // Preserve original event listeners
        document.getElementById('language-select').addEventListener('change', function() {
            const model = window.editor.getModel();
            monaco.editor.setModelLanguage(model, languageMap[this.value]);
        });

        document.getElementById('run-code').addEventListener('click', executeCode);
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') executeCode();
        });
    });

    async function executeCode() {
        if (isRunning) return;
        
        const code = window.editor.getValue();
        const language = document.getElementById('language-select').value;
        const inputElement = document.getElementById('user-input');
        const userInput = inputElement.value.trim();
        const runButton = document.getElementById('run-code');
        const outputElement = document.getElementById('output');
        
        try {
            isRunning = true;
            runButton.classList.add('running');
            outputElement.innerHTML = '';
            outputElement.classList.remove('error');

            // Add cyber loading effect
            const loading = document.createElement('div');
            loading.className = 'cyber-loading';
            loading.innerHTML = '<div class="scanline"></div>';
            outputElement.appendChild(loading);

            const response = await fetch("{% url 'execute_code' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ code, language, input: userInput })
            });

            const result = await response.json();
            outputElement.removeChild(loading);

            if (result.error) {
                outputElement.classList.add('error');
                outputElement.innerHTML = `<span class="glitch">${result.error}</span>`;
            } else {
                // Process output with cyber effect
                const outputLines = result.output.split('\n');
                outputElement.innerHTML = outputLines.map(line => 
                    `<div class="cyber-line">${line}</div>`
                ).join('');
            }

        } catch (error) {
            outputElement.innerHTML = `<span class="error-glitch">SYSTEM ERROR: ${error.message}</span>`;
        } finally {
            isRunning = false;
            runButton.classList.remove('running');
        }
    }
</script>

<style>
:root {
    --neon-cyan: #00ffb3;
    --neon-pink: #ff006e;
    --cyber-bg: #0a0a0f;
    --cyber-border: #00ffb3;
}

.cyber-container {
    max-width: 1400px;
    margin: 2rem auto;
    border: 2px solid var(--neon-cyan);
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0, 255, 179, 0.2);
    background: var(--cyber-bg);
}

.cyber-header {
    padding: 1rem;
    border-bottom: 2px solid var(--neon-cyan);
    background: linear-gradient(90deg, 
        rgba(0,255,179,0.1) 0%, 
        rgba(255,0,110,0.1) 100%);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.cyber-select {
    background: #000;
    color: var(--neon-cyan);
    border: 2px solid var(--neon-cyan);
    padding: 0.5rem 1rem;
    font-family: 'Orbitron', sans-serif;
    appearance: none;
}

.cyber-editor-grid {
    display: grid;
    grid-template-columns: 3fr 2fr;
    gap: 2rem;
    height: 70vh;
    padding: 2rem;
    text-align: left;
}

.cyber-editor {
    border: 2px solid var(--neon-cyan);
    border-radius: 6px;
    overflow: hidden;
    background: #000;
}

.cyber-io-panels {
    display: grid;
    gap: 2rem;
    height: 100%;
}

.cyber-panel {
    background: var(--cyber-bg);
    border: 2px solid var(--neon-cyan);
    border-radius: 6px;
    overflow: hidden;
}

.panel-header {
    padding: 1rem;
    background: rgba(0, 0, 0, 0.3);
    font-family: 'Orbitron', sans-serif;
    display: flex;
    align-items: center;
    gap: 1rem;
}

.cyber-console, .cyber-output {
    width: 100%;
    height: 100%;
    flex: 1;
    background: #000;
    color: var(--neon-cyan);
    font-family: 'Courier New', monospace;
    padding: 1rem;
    border: none;
    resize: none;
    outline: none;
}

.cyber-output {
    white-space: pre-wrap;
    overflow-y: auto;
    text-align: left;
}

.cyber-output.error {
    color: var(--neon-pink);
    border: 1px solid var(--neon-pink);
}

.cyber-button.cyan {
    background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink));
    border: none;
    padding: 1rem 2rem;
    font-family: 'Orbitron', sans-serif;
}

.scanline {
    position: absolute;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, var(--neon-cyan) 50%, transparent 100%);
    animation: scan 3s linear infinite;
}

@keyframes scan {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100vh); }
}

.glitch {
    animation: glitch 1s infinite;
    text-shadow: 2px 2px var(--neon-pink), -2px -2px var(--neon-cyan);
}

@keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-2px, 2px); }
    40% { transform: translate(-2px, -2px); }
    60% { transform: translate(2px, 2px); }
    80% { transform: translate(2px, -2px); }
    100% { transform: translate(0); }
}

.back-btn {
    position: fixed;
    bottom: 2rem;
    left: 2rem;
    background: rgba(255, 0, 110, 0.1);
    border: 2px solid var(--neon-pink);
}

@media (max-width: 768px) {
    .cyber-editor-grid {
        grid-template-columns: 1fr;
        height: auto;
    }
}
</style>
{% endblock %}
