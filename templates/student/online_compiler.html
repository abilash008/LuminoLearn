{% extends 'base.html' %}
{% load static %}

{% block title %}Online Compiler{% endblock %}

{% block content %}
<div class="compiler-container">
    <h1>Online Compiler</h1>
    <div id="editor" style="height:500px; width:100%; border:1px solid #ccc;"></div>
    <button id="runCode" class="gradient-btn-cyan">Run Code</button>
    <pre id="output" style="background:#222; color:#0f0; padding:10px;"></pre>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.33.0/min/vs/loader.min.js"></script>
<script>
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.33.0/min/vs' }});
    require(['vs/editor/editor.main'], function() {
        window.editor = monaco.editor.create(document.getElementById('editor'), {
            value: [
                'def hello_world():',
                '    print("Hello, world!")',
                '',
                'hello_world()'
            ].join('\n'),
            language: 'python',
            theme: 'vs-dark'
        });
    });
    
    document.getElementById('runCode').addEventListener('click', function() {
        // For demonstration, we'll simply display the code in the output area.
        // In a real-world application, you would send this code to a backend API for execution.
        var code = window.editor.getValue();
        document.getElementById('output').textContent = code;
    });
</script>
{% endblock %}
