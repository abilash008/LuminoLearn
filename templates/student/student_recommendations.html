{% extends 'base.html' %}
{% block title %}Recommended Courses{% endblock %}
{% block content %}
<h1>Recommended Courses</h1><br>
{% if recommended_courses %}
    {% for course in recommended_courses %}
    <div align="center">
        <div class="dashboard-card">
            {{ course.title }}
        </div><br>
    </div>
    {% endfor %}
{% else %}
    <p>No recommendations available.</p>
{% endif %}
{% endblock %}
