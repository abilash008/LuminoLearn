{% extends 'base.html' %}
{% load static %}

{% block content %}
<main class="cyber-container">
    <h1 class="neon-heading">Create Assignment for <span class="glowing-text">{{ course.title }}</span></h1>
    
    <form class="cyber-form" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="neon-label">Assignment Title</label>
            <input type="text" 
                class="cyber-input" 
                id="title" 
                name="title" 
                required
                placeholder="Enter assignment title..."
                autofocus>
        </div>

        <div class="form-group">
            <label class="neon-label">Description</label>
            <textarea class="cyber-textarea" 
                    id="description" 
                    name="description" 
                    rows="5"
                    required
                    placeholder="Describe the assignment..."></textarea>
        </div>

        <div class="form-group">
            <label class="neon-label">Deadline</label>
            <div class="datetime-picker">
                <input type="datetime-local" 
                    class="cyber-datetime" 
                    id="deadline" 
                    name="deadline" 
                    required>
                <i class="fas fa-calendar-alt"></i>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="gradient-btn-cyan">
                <i class="fas fa-rocket"></i> Launch Assignment
            </button>
            <a href="{% url 'educator_dashboard' %}" class="gradient-btn-secondary">
                <i class="fas fa-times"></i> Cancel
            </a>
        </div>
    </form>
</main>
{% endblock %}
