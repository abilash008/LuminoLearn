{% extends 'base.html' %}
{% load static %}

{% block content %}
<main class="cyber-container">
    <h1 class="neon-heading">Create New Course</h1>
    
    <form class="cyber-form" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <!-- Course Fields -->
        <div class="form-group">
            <label class="neon-label">Course Title</label>
            <input type="text" 
                class="cyber-input" 
                id="title" 
                name="title" 
                required
                placeholder="Enter course title..."
                autofocus>
        </div>

        <div class="form-group">
            <label class="neon-label">Course Description</label>
            <textarea class="cyber-textarea" 
                    id="description" 
                    name="description" 
                    rows="5"
                    required
                    placeholder="Describe your course..."></textarea>
        </div>

        <div class="form-group">
            <label class="neon-label">Course Thumbnail</label>
            <div class="file-upload-wrapper">
                <input type="file" 
                    class="cyber-file-input" 
                    id="thumbnail" 
                    name="thumbnail"
                    required>
                <label for="thumbnail" class="file-upload-label">
                    <i class="fas fa-cloud-upload-alt"></i> Choose Thumbnail
                </label>
                <span class="file-name" id="file-name">No file selected</span>
            </div>
            <div class="thumbnail-preview" id="thumbnail-preview"></div>
        </div>

        <div class="form-actions">
            <button type="submit" class="gradient-btn-cyan">
                <i class="fas fa-rocket"></i> Launch Course
            </button>
            <a href="{% url 'manage_courses' %}" class="gradient-btn-secondary">
                <i class="fas fa-times"></i> Cancel
            </a>
        </div>
    </form>
</main>
{% endblock %}
