{% extends 'base.html' %}
{% load static %}

{% block content %}
<main class="cyber-container">
    <h1 class="neon-heading">Add Choices for: <span class="glowing-text">{{ question.question_text }}</span></h1>
    
    <form class="cyber-form" method="post" action="{% url 'add_choices' %}">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="neon-label">Choice Text</label>
            <input type="text" 
                class="cyber-input" 
                name="choice_text" 
                required
                placeholder="Enter choice text...">
        </div>

        <div class="form-group">
            <label class="cyber-checkbox">
                <input type="checkbox" name="is_correct">
                <span class="checkmark"></span>
                Correct Answer
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="gradient-btn-cyan">
                <i class="fas fa-plus-circle"></i> Add Choice
            </button>
            <a href="{% url 'add_questions' assignment_id=question.assignment.id %}" 
            class="gradient-btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Questions
            </a>
        </div>
    </form>
</main>
{% endblock %}
