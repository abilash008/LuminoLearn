{% extends 'base.html' %}
{% load static %}

{% block title %}Add Topic to {{ course.title }}{% endblock %}

{% block content %}
<main class="cyber-container">
    <h1 class="neon-heading">Add Topic to: <span class="glowing-text">{{ course.title }}</span></h1>
    
    <form class="cyber-form" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="neon-label" for="topic_name">Topic Name</label>
            <input type="text" class="cyber-input" id="topic_name" name="topic_name" placeholder="Enter topic name...">
        </div>

        <div class="form-group">
            <label class="neon-label" for="topic_content">Topic Content</label>
            <textarea class="cyber-textarea" id="topic_content" name="topic_content" rows="5" placeholder="Enter topic content..."></textarea>
        </div>

        <div class="form-group">
            <label class="neon-label" for="topic_diagrams">Topic Diagrams</label>
            <div class="file-upload-wrapper">
                <input type="file" class="cyber-file-input" id="topic_diagrams" name="topic_diagrams" accept="image/*" multiple>
                <label for="topic_diagrams" class="file-upload-label">
                    <i class="fas fa-cloud-upload-alt"></i> Choose Diagrams
                </label>
                <span class="file-name" id="diagram-file-name">No file selected</span>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="gradient-btn-cyan">
                <i class="fas fa-rocket"></i> Save Topic
            </button>
            <a href="{% url 'edit_course' course.id %}" class="gradient-btn-secondary">
                <i class="fas fa-times"></i> Cancel
            </a>
        </div>
    </form>
</main>
{% endblock %}
