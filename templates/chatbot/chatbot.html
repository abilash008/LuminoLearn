{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="chatbot-container">
    <h2>AI Chatbot</h2>
    <div id="chat-window" class="chat-window"></div>

    <div class="chat-input">
        <input type="text" id="user-message" placeholder="Type your message...">
        <button id="send-btn">Send</button>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const userMessageInput = document.getElementById('user-message');
    const sendBtn = document.getElementById('send-btn');

    function appendMessage(author, message) {
        const msgDiv = document.createElement('div');
        msgDiv.className = author === 'user' ? 'msg user' : 'msg bot';
        msgDiv.innerText = author.toUpperCase() + ": " + message;
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function sendMessage() {
        const userMessage = userMessageInput.value.trim();
        if(!userMessage) return;
        appendMessage('user', userMessage);
        userMessageInput.value = '';

        const formData = new FormData();
        formData.append('message', userMessage);

        try {
            const response = await fetch("{% url 'chatbot_respond' %}", {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            if(result.reply) {
                appendMessage('bot', result.reply);
            } else if(result.error) {
                appendMessage('bot', "Error: " + result.error);
            }
        } catch (error) {
            appendMessage('bot', "Error: " + error.message);
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    userMessageInput.addEventListener('keypress', (e) => {
        if(e.key === 'Enter') {
            sendMessage();
        }
    });
</script>

<style>
.chatbot-container {
    width: 600px auto ;
    margin: 20px auto;
    border: 2px solid #ccc;
    border-radius: 8px;
    padding: 15px;
    background:rgba(249, 249, 249, 0);
}

.chat-window {
    height: 300px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #ccc;
    padding: 10px;
    margin-bottom: 10px;
}

.msg {
    margin: 5px 0;
    padding: 8px;
    border-radius: 4px;
}
.msg.user {
    background-color:rgb(17, 209, 239);
    text-align: right;
}
.msg.bot {
    background-color:rgb(17, 209, 239);
    text-align: left;
}

.chat-input {
    display: flex;
    gap: 10px;
}
.chat-input input[type="text"] {
    flex: 1;
    padding: 8px;
    border: 1px solid #ccc;
}
</style>
{% endblock %}
