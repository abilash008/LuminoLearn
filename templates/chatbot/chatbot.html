{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="chatbot-container">
    <div class="chat-header">
        <h2>AI Chatbot</h2>
        <div class="chat-status">Online</div>
    </div>
    
    <div id="chat-window" class="chat-window">
        <div class="chat-history"></div>
    </div>

    <div class="chat-input-container">
        <div class="chat-input">
            <textarea id="user-message" placeholder="Type your message..." rows="1"></textarea>
            <button id="send-btn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
        <div class="chat-footer">AI may produce inaccurate information</div>
    </div>
    {% csrf_token %}
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const chatHistory = chatWindow.querySelector('.chat-history');
    const userMessageInput = document.getElementById('user-message');
    const sendBtn = document.getElementById('send-btn');
    
    // Auto-resize textarea
    userMessageInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });
    
    function appendMessage(author, message, streaming = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${author} ${streaming ? 'streaming' : ''}`;
        
        if (author === 'user') {
            msgDiv.innerHTML = `
                <div class="message-content">
                    <div class="message-text">${message}</div>
                </div>
            `;
        } else {
            msgDiv.innerHTML = `
                <div class="message-content">
                    <div class="message-text">${message}</div>
                    <div class="message-actions">
                        <button class="action-btn"><i class="fas fa-thumbs-up"></i></button>
                        <button class="action-btn"><i class="fas fa-thumbs-down"></i></button>
                    </div>
                </div>
            `;
        }
        
        chatHistory.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }
    
    async function sendMessage() {
        const userMessage = userMessageInput.value.trim();
        if(!userMessage) return;
        
        appendMessage('user', userMessage);
        userMessageInput.value = '';
        userMessageInput.style.height = 'auto';
        sendBtn.disabled = true;
    
        // Add loading spinner
        const loadingSpinner = document.createElement('div');
        loadingSpinner.className = 'loading-spinner';
        chatHistory.appendChild(loadingSpinner);
    
        try {
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            
            const response = await fetch("{% url 'chatbot_respond' %}", {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams({
                    'message': userMessage
                })
            });
    
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
    
            const result = await response.json();
            
            if(result.reply) {
                appendMessage('bot', result.reply);
            } else {
                throw new Error(result.error || 'No reply received');
            }
        } catch (error) {
            let errorMessage = 'An error occurred';
            if (error instanceof TypeError) {
                errorMessage = 'Network error - please check your connection';
            } else if (error.message.includes('400')) {
                errorMessage = 'Invalid request - please try again';
            } else if (error.message.includes('500')) {
                errorMessage = 'Server error - please try again later';
            }
            appendMessage('bot', errorMessage);
        } finally {
            // Remove loading spinner
            loadingSpinner.remove();
            sendBtn.disabled = false;
        }
    }
    
    sendBtn.addEventListener('click', sendMessage);
    userMessageInput.addEventListener('keypress', (e) => {
        if(e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>

<style>
    .chatbot-container {
        width: 100%;
        max-width: 800px;
        margin: 20px auto;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 80vh;
    }
    
    .chat-header {
        padding: 16px;
        background: #2563eb;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .chat-status {
        font-size: 0.9em;
        padding: 4px 8px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.2);
    }
    
    .chat-window {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        background: #f9fafb;
    }
    
    .chat-history {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    
    .msg {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 16px;
        position: relative;
    }
    
    .msg.user {
        background: #2563eb;
        color: white;
        align-self: flex-end;
        text-align: justify;
        border-bottom-right-radius: 4px;
    }
    
    .msg.bot {
        background: #2563eb;
        color: white;
        border: 1px solid #e5e7eb;
        align-self: flex-start;
        text-align: justify;
        border-bottom-left-radius: 4px;
    }
    
    .msg.streaming .message-text::after {
        content: '';
        display: inline-block;
        width: 8px;
        height: 16px;
        background: #2563eb;
        margin-left: 4px;
        animation: blink 1s infinite;
    }
    
    @keyframes blink {
        50% { opacity: 0; }
    }
    
    .chat-input-container {
        border-top: 1px solid #e5e7eb;
        padding: 16px;
        background: white;
    }
    
    .chat-input {
        display: flex;
        gap: 8px;
        align-items: flex-end;
    }
    
    .chat-input textarea {
        flex: 1;
        padding: 12px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        resize: none;
        max-height: 120px;
        line-height: 1.5;
    }
    
    #send-btn {
        padding: 12px 16px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
    }
    
    .chat-footer {
        font-size: 0.8em;
        color: #6b7280;
        text-align: center;
        margin-top: 8px;
    }
    
    .message-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
    }
    
    .action-btn {
        background: none;
        border: none;
        color: #6b7280;
        cursor: pointer;
        padding: 4px;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    .loading-spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 10px auto;
    }
</style>

{% endblock %}
