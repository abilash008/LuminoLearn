{% extends 'base.html' %}
{% load static %}

{% block content %}
<main class="cyber-container">
    <h1 class="neon-heading">Edit: <span class="glowing-text">{{ assignment.title }}</span></h1>
    
    <form class="cyber-form" method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="neon-label">Title</label>
            <input type="text" 
                class="cyber-input" 
                name="title" 
                value="{{ assignment.title }}"
                required>
        </div>

        <div class="form-group">
            <label class="neon-label">Description</label>
            <textarea class="cyber-textarea" 
                    name="description"
                    required>{{ assignment.description }}</textarea>
        </div>

        <div class="form-group">
            <label class="neon-label">Deadline</label>
            <input type="datetime-local" 
                class="cyber-datetime" 
                name="deadline" 
                value="{{ assignment.deadline|date:'Y-m-d\TH:i' }}"
                required>
        </div>

        <div class="form-actions">
            <button type="submit" class="gradient-btn-cyan">
                <i class="fas fa-save"></i> Save Changes
            </button>
            <a href="{% url 'educator_assignments' %}" class="gradient-btn-secondary">
                <i class="fas fa-times"></i> Cancel
            </a>
        </div>
    </form>
</main>
{% endblock %}
