{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Topic: {{ topic.name }}{% endblock %}

{% block content %}
<main class="cyber-container">
    <h1 class="neon-heading">Edit Topic: <span class="glowing-text">{{ topic.name }}</span></h1>
    
    <form class="cyber-form" method="post" enctype="multipart/form-data" action="{% url 'edit_topic' %}">
        {% csrf_token %}
        
        <!-- Topic Name -->
        <div class="form-group">
            <label class="neon-label" for="topic_name">Topic Name</label>
            <input type="text" class="cyber-input" id="topic_name" name="topic_name" value="{{ topic.name }}" required>
        </div>

        <!-- Topic Content -->
        <div class="form-group">
            <label class="neon-label" for="topic_content">Topic Content</label>
            <textarea class="cyber-textarea" id="topic_content" name="topic_content" rows="5" required>{{ topic.content }}</textarea>
        </div>

        <!-- Option to add new diagrams -->
        <div class="form-group">
            <label class="neon-label" for="topic_diagrams">Add New Diagrams</label>
            <div class="file-upload-wrapper">
                <input type="file" class="cyber-file-input" id="topic_diagrams" name="topic_diagrams" accept="image/*" multiple>
                <label for="topic_diagrams" class="file-upload-label">
                    <i class="fas fa-cloud-upload-alt"></i> Choose Diagrams
                </label>
                <span class="file-name" id="diagram-file-name">No file selected</span>
            </div>
            <div class="thumbnail-preview" id="thumbnail-preview"></div>
        </div>

        <div class="form-actions">
            <button type="submit" class="gradient-btn-cyan">
                <i class="fas fa-save"></i> Save Changes
            </button>
            <a href="{% url 'edit_course' topic.course.id %}" class="gradient-btn-secondary">
                <i class="fas fa-times"></i> Cancel
            </a>
        </div>
    </form>
</main>
{% endblock %}
